name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build SmartNotesPro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 & accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant Gradle wrapper execute permission
        run: chmod +x android/gradlew

      - name: Determine build flags
        id: flags
        run: |
          INPUT_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_debug=true" >> "$GITHUB_OUTPUT"
            echo "build_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_TYPE" == "both" ]]; then
            echo "build_debug=true" >> "$GITHUB_OUTPUT"
            echo "build_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_TYPE" == "release" ]]; then
            echo "build_debug=false" >> "$GITHUB_OUTPUT"
            echo "build_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_debug=true" >> "$GITHUB_OUTPUT"
            echo "build_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        if: steps.flags.outputs.build_debug == 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: steps.flags.outputs.build_release == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK outputs
        id: apks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out-apks

          if [[ -f android/app/build/outputs/apk/debug/app-debug.apk ]]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk out-apks/SmartNotesPro-debug.apk
          fi

          UNSIGNED_REL="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -f "$UNSIGNED_REL" ]]; then
            if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASS" && -n "$KEY_ALIAS" ]]; then
              echo "$KEYSTORE_B64" | base64 --decode > release.keystore
              ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
              APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
              export SIGN_KEY_PASS="${KEY_PASS:-$KEYSTORE_PASS}"
              "$ZIPALIGN" -f -p 4 "$UNSIGNED_REL" out-apks/SmartNotesPro-release-aligned.apk
              "$APKSIGNER" sign \
                --ks release.keystore \
                --ks-pass "env:KEYSTORE_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "env:SIGN_KEY_PASS" \
                --out out-apks/SmartNotesPro-release-signed.apk \
                out-apks/SmartNotesPro-release-aligned.apk
              rm -f out-apks/SmartNotesPro-release-aligned.apk release.keystore
            else
              cp "$UNSIGNED_REL" out-apks/SmartNotesPro-release-unsigned.apk
            fi
          fi

          ls -lh out-apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartNotesPro-Android-APK
          path: out-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out-apks/*.apk
          generate_release_notes: true

      - name: Write build summary
        run: |
          echo "### SmartNotesPro Android APK Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **SmartNotesPro-Android-APK** artifact from this workflow run and install \`SmartNotesPro-debug.apk\` on your Android device." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out-apks/ >> "$GITHUB_STEP_SUMMARY"
